services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_DNS_RESOLVER: "${BACKEND_DNS_RESOLVER:-10.89.1.1}"
      NGINX_ENVSUBST_FILTER: ^BACKEND_DNS_RESOLVER
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    external: true
    name: ${BACKEND_DOCKER_NETWORK:-backend-legacy-laravel8_default}
